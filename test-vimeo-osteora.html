<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Test Vimeo — Ostéo RA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(91, 220, 255, 0.22), transparent 34%),
        radial-gradient(circle at 85% 25%, rgba(120, 90, 255, 0.18), transparent 34%),
        linear-gradient(135deg, #050814, #0b1728 55%, #02040a);
      color: #f7f9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .page {
      width: min(980px, 100%);
    }

    .card {
      border: 1px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.045));
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.42);
      backdrop-filter: blur(18px);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: radial-gradient(circle at 35% 30%, #ffffff, #66eaff 35%, #2450ff 100%);
      box-shadow: 0 0 30px rgba(102,234,255,0.5);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing: -0.04em;
    }

    p {
      margin: 6px 0 0;
      color: #aeb8cc;
      line-height: 1.45;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.14);
      margin-top: 20px;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .pill {
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 14px;
      color: #aeb8cc;
      font-size: 14px;
    }

    .pill strong {
      display: block;
      color: #f7f9ff;
      margin-bottom: 4px;
    }

    code {
      color: #d9fbff;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="header">
        <div class="logo"></div>
        <div>
          <h1>Test Vimeo — Ostéo RA</h1>
          <p>Test de lecture depuis le Vimeo de la bibliothèque d’équipe.</p>
        </div>
      </div>

      <div class="video-box">
        <iframe
          src="https://player.vimeo.com/video/540020382?title=0&byline=0&portrait=0&badge=0"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <div class="info">
        <div class="pill">
          <strong>Vidéo utilisée</strong>
          ID Vimeo : <code>540020382</code>
        </div>

        <div class="pill">
          <strong>Domaine à autoriser dans Vimeo</strong>
          <code>nbertrandmacadamtonic-create.github.io</code>
        </div>

        <div class="pill">
          <strong>Résultat attendu</strong>
          La vidéo doit se lire sans message de confidentialité.
        </div>
      </div>
    </section>
  </main>
</body>
</html>
